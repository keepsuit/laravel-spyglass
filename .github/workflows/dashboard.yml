name: dashboard

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'resources/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # dist/ is ignored so local builds never end up in a pull request: only main carries it.
      # Plain git: git-auto-commit-action's dirty check skips ignored files and never commits.
      - name: Commit the build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          git diff --cached --quiet || { git commit -m 'Build dashboard' && git push; }
